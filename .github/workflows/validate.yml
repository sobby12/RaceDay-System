
name: Validate RaceDay Project

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          test -d RaceDay.API
          test -d RaceDay.MVC
          test -d RaceDay.API.Tests
          test -d docs
          test -d .github/workflows

      - name: Check required files
        run: |
          test -f README.md
          test -f docs/RaceDay_Database_Final.sql
          test -f docs/RaceDay.docx
          test -f docs/RaceDay_ERD.drawio.png

      - name: Validate SQL script
        run: |
          test -s docs/RaceDay_Database_Final.sql

      - name: Validation successful
        run: echo "RaceDay project structure and documentation validated successfully."

